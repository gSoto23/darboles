version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      # Los valores por defecto (darboles_user/darboles_password/darboles_db)
      # solo aplican si no defines DB_USER/DB_PASSWORD/DB_NAME en tu .env —
      # se mantienen como fallback para no romper despliegues existentes que
      # todavía no los definieron, pero en producción deberías setearlos con
      # una contraseña real y quitar la dependencia del valor por defecto.
      POSTGRES_USER: ${DB_USER:-darboles_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-darboles_password}
      POSTGRES_DB: ${DB_NAME:-darboles_db}
    env_file:
      - .env
    ports:
      # Solo accesible desde el propio servidor (127.0.0.1), no desde internet.
      # Si necesitás conectarte desde tu laptop, usá un túnel SSH en vez de
      # abrir este puerto públicamente.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-darboles_user} -d ${DB_NAME:-darboles_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8001:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
